name: Publish
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - 'v20[0-9][0-9]-[0-9][0-9]'
    paths:
      - .speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  integration-tests:
    uses: ./.github/workflows/test-integration.yaml
    secrets:
      WISTIA_API_KEY: ${{ secrets.WISTIA_API_KEY }}

  publish:
    needs: integration-tests
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    with:
      target: wistia
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      npm_token: ${{ secrets.NPM_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  notify-wistia:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to wistia repo
        run: |
          gh api repos/wistia/wistia/dispatches \
            -f event_type=code-samples-updated
        env:
          GH_TOKEN: ${{ secrets.WISTIA_REPO_PAT }}
